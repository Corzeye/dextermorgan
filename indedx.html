<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Player</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0e0e10;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .player {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  #playBtn {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: none;
    background: #f2f2f2;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  #playBtn:hover {
    background: #ffffff;
    transform: scale(1.05);
  }

  #playBtn:active {
    transform: scale(0.96);
  }

  #playBtn svg {
    fill: #0e0e10;
  }

  .seek-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 320px;
  }

  #seek {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: #3a3a3d;
    outline: none;
    cursor: pointer;
  }

  #seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #f2f2f2;
    cursor: pointer;
  }

  #seek::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: none;
    border-radius: 50%;
    background: #f2f2f2;
    cursor: pointer;
  }

  .time {
    font-size: 12px;
    color: #9a9a9e;
    font-variant-numeric: tabular-nums;
    width: 38px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="player">
  <button id="playBtn" aria-label="Play">
    <svg id="playIcon" width="34" height="34" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="pauseIcon" width="34" height="34" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>

  <div class="seek-row">
    <span class="time" id="current">0:00</span>
    <input type="range" id="seek" value="0" min="0" max="100" step="0.1">
    <span class="time" id="duration">0:00</span>
  </div>
</div>

<audio id="audio" src="audio.mp3" preload="metadata"></audio>

<script>
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const seek = document.getElementById('seek');
  const currentEl = document.getElementById('current');
  const durationEl = document.getElementById('duration');

  audio.volume = 1;

  function formatTime(t) {
    if (!isFinite(t)) return '0:00';
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  playBtn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play();
    } else {
      audio.pause();
    }
  });

  audio.addEventListener('play', () => {
    playIcon.style.display = 'none';
    pauseIcon.style.display = '';
    playBtn.setAttribute('aria-label', 'Pause');
  });

  audio.addEventListener('pause', () => {
    playIcon.style.display = '';
    pauseIcon.style.display = 'none';
    playBtn.setAttribute('aria-label', 'Play');
  });

  audio.addEventListener('loadedmetadata', () => {
    seek.max = audio.duration;
    durationEl.textContent = formatTime(audio.duration);
  });

  audio.addEventListener('timeupdate', () => {
    if (!seek.matches(':active')) {
      seek.value = audio.currentTime;
    }
    currentEl.textContent = formatTime(audio.currentTime);
  });

  seek.addEventListener('input', () => {
    audio.currentTime = seek.value;
    currentEl.textContent = formatTime(seek.value);
  });
</script>

</body>
</html>
